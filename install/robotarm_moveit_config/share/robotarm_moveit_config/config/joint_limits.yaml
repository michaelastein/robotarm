default_velocity_scaling_factor: 0.5
default_acceleration_scaling_factor: 0.5

joint_limits:
  base_joint:
    has_velocity_limits: true
    max_velocity: 0.30
    has_acceleration_limits: true
    max_acceleration: 0.15

  shoulder_joint:
    has_velocity_limits: true
    max_velocity: 0.18
    has_acceleration_limits: true
    max_acceleration: 0.10

  elbow_joint:
    has_velocity_limits: true
    max_velocity: 0.22
    has_acceleration_limits: true
    max_acceleration: 0.12
