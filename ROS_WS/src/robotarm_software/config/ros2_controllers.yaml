controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController


joint_state_broadcaster:
  ros__parameters: {}


velocity_controller:
  ros__parameters:
    joints:
      - base_joint
      - shoulder_joint
      - elbow_joint

    command_interfaces:
      - velocity

    state_interfaces:
      - position
      - velocity

    command_timeout: 0.2
    state_publish_rate: 50


arm_trajectory_controller:
  ros__parameters:
    joints:
      - base_joint
      - shoulder_joint
      - elbow_joint

    command_interfaces:
      - velocity

    state_interfaces:
      - position
      - velocity

    interpolation_method: splines

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: false

    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.15

      base_joint:
        trajectory: 0.30
        goal: 0.08

      shoulder_joint:
        trajectory: 0.4
        goal: 0.10

      elbow_joint:
        trajectory: 0.45
        goal: 0.1

    gains:
      base_joint:
        p: 0.80
        i: 0.0
        d: 0.0
        i_clamp: 0.0
        ff_velocity_scale: 1.0

      shoulder_joint:
        p: 0.35
        i: 0.0
        d: 0.0
        i_clamp: 0.0
        ff_velocity_scale: 1.0

      elbow_joint:
        p: 0.35
        i: 0.0
        d: 0.0
        i_clamp: 0.0
        ff_velocity_scale: 1.0
